spring.application.name=pharma_security
server.port=8081

# MySQL (la base est creee automatiquement si elle n'existe pas)
spring.datasource.url=jdbc:mysql://localhost:3306/pharma_security?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false
