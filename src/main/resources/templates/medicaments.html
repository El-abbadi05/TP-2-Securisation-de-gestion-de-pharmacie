<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Medicaments - Pharmacie</title>
<style>
 body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 15px;color:#222}
 table{border-collapse:collapse;width:100%;margin:15px 0}
 th,td{border:1px solid #ccc;padding:8px;text-align:left}
 th{background:#198754;color:#fff}
 .ok{background:#d1e7dd;padding:8px;margin:10px 0}
 .ko{background:#f8d7da;padding:8px;margin:10px 0}
 input,select,button{padding:6px;margin:2px}
 button{background:#198754;color:#fff;border:0;cursor:pointer}
 button.danger{background:#dc3545}
 nav a{margin-right:12px}
</style></head>
<body>
<h1>Medicaments</h1>
<nav>
    <a th:href="@{/home}">Accueil</a>
    <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">Administration</a>
</nav>

<div class="ok" th:if="${success}" th:text="${success}"></div>
<div class="ko" th:if="${error}" th:text="${error}"></div>

<table>
    <tr>
        <th>Nom</th><th>Description</th><th>Prix (DH)</th><th>Stock</th>
        <th sec:authorize="hasAnyRole('ADMIN','PHARMACIEN','CAISSIER')">Actions</th>
    </tr>
    <tr th:each="m : ${medicaments}">
        <td th:text="${m.nom}"></td>
        <td th:text="${m.description}"></td>
        <td th:text="${#numbers.formatDecimal(m.prix, 1, 2)}"></td>
        <td th:text="${m.stock}"></td>
        <td sec:authorize="hasAnyRole('ADMIN','PHARMACIEN','CAISSIER')">
            <form th:action="@{/medicaments/vendre/{id}(id=${m.id})}" method="post" style="display:inline">
                <input type="number" name="quantite" value="1" min="1" style="width:60px">
                <button type="submit">Vendre</button>
            </form>
            <form th:action="@{/medicaments/stock/{id}(id=${m.id})}" method="post" style="display:inline"
                  sec:authorize="hasAnyRole('ADMIN','PHARMACIEN')">
                <input type="number" name="stock" th:value="${m.stock}" min="0" style="width:70px">
                <button type="submit">Maj stock</button>
            </form>
            <form th:action="@{/medicaments/supprimer/{id}(id=${m.id})}" method="post" style="display:inline"
                  sec:authorize="hasRole('ADMIN')">
                <button type="submit" class="danger">Supprimer</button>
            </form>
        </td>
    </tr>
</table>

<div sec:authorize="hasRole('ADMIN')">
    <h3>Ajouter un medicament</h3>
    <form th:action="@{/medicaments/ajouter}" method="post">
        <input type="text" name="nom" placeholder="Nom" required>
        <input type="text" name="description" placeholder="Description">
        <input type="number" step="0.01" name="prix" placeholder="Prix" required>
        <input type="number" name="stock" placeholder="Stock" min="0" required>
        <button type="submit">Ajouter</button>
    </form>
</div>
</body>
</html>
