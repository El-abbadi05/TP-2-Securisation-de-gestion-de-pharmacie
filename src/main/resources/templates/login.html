<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Connexion - Pharmacie</title>
<style>
 body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 15px;color:#222}
 table{border-collapse:collapse;width:100%;margin:15px 0}
 th,td{border:1px solid #ccc;padding:8px;text-align:left}
 th{background:#198754;color:#fff}
 .ok{background:#d1e7dd;padding:8px;margin:10px 0}
 .ko{background:#f8d7da;padding:8px;margin:10px 0}
 input,select,button{padding:6px;margin:2px}
 button{background:#198754;color:#fff;border:0;cursor:pointer}
 button.danger{background:#dc3545}
 nav a{margin-right:12px}
</style></head>
<body>
<h1>Gestion de pharmacie</h1>
<h2>Connexion</h2>
<div class="ko" th:if="${param.error}">Nom d'utilisateur ou mot de passe incorrect.</div>
<div class="ok" th:if="${param.logout}">Vous avez ete deconnecte.</div>
<form th:action="@{/login}" method="post">
    <div><input type="text" name="username" placeholder="Nom d'utilisateur" required autofocus></div>
    <div><input type="password" name="password" placeholder="Mot de passe" required></div>
    <button type="submit">Se connecter</button>
</form>
</body>
</html>
